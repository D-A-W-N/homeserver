        - { name: WEBDL-1080p, min: 4, preferred: 25, max: 110 }
        - { name: Bluray-1080p, min: 4, preferred: 25, max: 110 }
    quality_profiles:
      - name: Standard
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: false
          until_quality: HD 720p/1080p
        min_format_score: 0
        qualities:
          - name: HD 720p/1080p
            qualities:
              - HDTV-720p
              - WEBRip-720p
              - WEBDL-720p
              - Bluray-720p
              - HDTV-1080p
              - WEBRip-1080p
              - WEBDL-1080p
              - Bluray-1080p
      - name: Staffelpaket Low
