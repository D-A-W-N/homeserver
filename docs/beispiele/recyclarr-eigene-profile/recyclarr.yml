---
# ENTWURF (2026-10-23, nicht mit Recyclarr getestet): eigene Profile statt TRaSH-Profile.
# Live per API angelegt und geprüft; API-Schlüssel kommen aus secrets.yml (schreibt das Setup).
# Eigene Custom Formats liegen in custom-formats/<app>/ (settings.yml: resource_providers).

sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_api_key
    delete_old_custom_formats: true
    quality_definition:
      type: series
      qualities:
        - { name: SDTV, min: 2, preferred: 10, max: 20 }
        - { name: DVD, min: 2, preferred: 10, max: 20 }
        - { name: WEBDL-480p, min: 2, preferred: 10, max: 20 }
        - { name: WEBRip-480p, min: 2, preferred: 10, max: 20 }
        - { name: Bluray-480p, min: 2, preferred: 10, max: 20 }
        - { name: Bluray-576p, min: 2, preferred: 10, max: 20 }
        - { name: HDTV-720p, min: 3, preferred: 15, max: 60 }
        - { name: WEBRip-720p, min: 3, preferred: 15, max: 60 }
        - { name: WEBDL-720p, min: 3, preferred: 15, max: 60 }
        - { name: Bluray-720p, min: 3, preferred: 15, max: 60 }
