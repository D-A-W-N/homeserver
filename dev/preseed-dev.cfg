
### Nur für dev/vm-test.sh autoinstall: alle Rückfragen vorbelegt (NIE für echte Installationen)
d-i passwd/username seen true
d-i passwd/user-password password aunserver
d-i passwd/user-password-again password aunserver
d-i passwd/user-password seen true
d-i passwd/user-password-again seen true
d-i user-setup/allow-password-weak boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i debian-installer/exit/poweroff boolean true
