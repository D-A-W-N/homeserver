---
# Neustart statt reload: smbd übernimmt geänderte "smb ports" nur beim Start (M3-Test)
- name: Samba neu starten
  ansible.builtin.systemd_service:
    name: smbd.service
    state: restarted

- name: Samba-Legacy neu starten
  ansible.builtin.systemd_service:
    name: smbd-legacy.service
    state: restarted
    daemon_reload: true
