---
# Medien-Stack (M5): Servarr (apps.medien, D25), Emby, Recommendarr. Ausrollen, dann die
# Servarr-Apps verbinden (servarr.yml). Ist nichts davon an, wird der Stack entfernt;
# die Einstellungen unter appdata bleiben.
# Von Hand bleibt: Usenet-Server (SABnzbd), Indexer (Prowlarr), Bibliotheken und Konto (Emby).

- name: Konfigurationsordner der Medien-Apps
  ansible.builtin.file:
    path: "{{ appdata_dir }}/{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"
  loop: "{{ (stacks_servarr_dirs if apps.medien | bool else []) + (['emby'] if apps.emby | bool else []) }}"
  vars:
    stacks_servarr_dirs: [prowlarr, sabnzbd, sonarr, radarr, lidarr, bazarr, recyclarr]

- name: Konfigurationsordner für Recommendarr (Image läuft fest als UID 1000)
  ansible.builtin.file:
    path: "{{ appdata_dir }}/recommendarr"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  when: apps.recommendarr | bool

- name: Stack media
  ansible.builtin.include_tasks: deploy.yml
  vars:
    stack_name: media
    stack_files: [compose.yaml]
  when: apps.medien | bool or apps.emby | bool or apps.recommendarr | bool

- name: Gibt es den Stack media noch?
  ansible.builtin.stat:
    path: "{{ stacks_dir }}/media/compose.yaml"
  register: stacks_media_compose
  when: not (apps.medien | bool or apps.emby | bool or apps.recommendarr | bool)

- name: Stack media entfernen (keine Medien-App an)
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_dir }}/media"
    state: absent
  when:
    - not (apps.medien | bool or apps.emby | bool or apps.recommendarr | bool)
    - stacks_media_compose.stat.exists

- name: Vorlage des entfernten Stacks media löschen
  ansible.builtin.file:
    path: "{{ stacks_dir }}/media/compose.yaml"
    state: absent
  when:
    - not (apps.medien | bool or apps.emby | bool or apps.recommendarr | bool)
    - stacks_media_compose.stat.exists

- name: Servarr-Apps verbinden
  ansible.builtin.include_tasks: servarr.yml
  when: apps.medien | bool
