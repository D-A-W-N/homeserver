---
- name: AdGuard Home
  when: apps.adguard | bool
  block:
    - name: Stack dns (AdGuard Home)
      ansible.builtin.include_tasks: deploy.yml
      vars:
        stack_name: dns
        stack_files: [compose.yaml]

    # Beim ersten Start läuft der Einrichtungsassistent auf Port 3000 (alle Schnittstellen).
    # Danach liegt die Oberfläche auf 127.0.0.1:{{ stacks_ports.adguard_ui }} (S3).
    # An der Konfigurationsdatei erkennen statt per HTTP: direkt nach einem Neustart (z. B. nach dem
    # Zurückspielen eines Backups) antwortet noch keiner der beiden Ports (M8-Test)
    - name: Ist AdGuard schon eingerichtet?
      ansible.builtin.stat:
        path: "{{ appdata_dir }}/adguard/conf/AdGuardHome.yaml"
      register: stacks_adguard_conf

    - name: Auf den Einrichtungsassistenten warten
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/control/install/get_addresses
      register: stacks_adguard_wizard
      until: stacks_adguard_wizard is succeeded
      retries: 30
      delay: 2
      when: not stacks_adguard_conf.stat.exists

    - name: AdGuard-Assistent per API abschließen
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/control/install/configure
        method: POST
        body_format: json
        body:
          web: { ip: 127.0.0.1, port: "{{ stacks_ports.adguard_ui }}" }
          dns: { ip: 0.0.0.0, port: 53 }
          username: "{{ admin_user }}"
          password: "{{ stacks_web_password }}"
        status_code: 200
      when: not stacks_adguard_conf.stat.exists
      changed_when: true
      no_log: true

    # AdGuard hat keine API dafür: Hash in der Datei tauschen, solange AdGuard steht
    - name: AdGuard für den Passwortwechsel anhalten
      ansible.builtin.command: docker stop adguard
      when: stacks_web_password_wechsel and stacks_adguard_conf.stat.exists
      changed_when: true

    - name: Neues Web-Passwort in AdGuard
      ansible.builtin.replace:
        path: "{{ appdata_dir }}/adguard/conf/AdGuardHome.yaml"
        regexp: '^(\s+password: )\$2[aby]\$\S+$'
        replace: '\g<1>{{ stacks_web_password_hash }}'
      when: stacks_web_password_wechsel and stacks_adguard_conf.stat.exists
      no_log: true

    - name: AdGuard wieder starten
      ansible.builtin.command: docker start adguard
      when: stacks_web_password_wechsel and stacks_adguard_conf.stat.exists
      changed_when: true

    - name: Warten, bis die Oberfläche auf dem neuen Port antwortet
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ stacks_ports.adguard_ui }}/control/status
        user: "{{ admin_user }}"
        password: "{{ stacks_web_password }}"
        force_basic_auth: true
      register: stacks_adguard_status
      until: stacks_adguard_status is succeeded
      retries: 30
      delay: 2
      no_log: true

    - name: Vorhandene DNS-Umschreibungen lesen
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ stacks_ports.adguard_ui }}/control/rewrite/list
        user: "{{ admin_user }}"
        password: "{{ stacks_web_password }}"
        force_basic_auth: true
        return_content: true
      register: stacks_adguard_rewrites
      no_log: true

    - name: Namen des NAS und aller Apps auf seine IP zeigen lassen
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ stacks_ports.adguard_ui }}/control/rewrite/add
        method: POST
        user: "{{ admin_user }}"
        password: "{{ stacks_web_password }}"
        force_basic_auth: true
        body_format: json
        body: { domain: "{{ item }}", answer: "{{ ansible_facts.default_ipv4.address }}", enabled: true }
      loop: ["{{ domain }}", "*.{{ domain }}"]
      when: >-
        stacks_adguard_rewrites.json | default([])
        | selectattr('domain', 'equalto', item)
        | selectattr('answer', 'equalto', ansible_facts.default_ipv4.address)
        | list | length == 0
      changed_when: true
      no_log: true

    # Exit-Node-Geräte schicken alle DNS-Anfragen an das NAS, Split DNS greift dann nicht.
    # Mit network_dns_adguard fragt das NAS zuerst AdGuard; dhcpcd stellt resolv.conf.head voran,
    # die DNS-Server aus DHCP bleiben als Rückfall.
    - name: AdGuard als erster DNS des NAS
      ansible.builtin.copy:
        dest: /etc/resolv.conf.head
        content: |
          # Von aunserver verwaltet (Ansible, network_dns_adguard), Änderungen werden überschrieben.
          nameserver 127.0.0.1
        owner: root
        group: root
        mode: "0644"
      when: network_dns_adguard | bool
      register: stacks_resolv_head_an

    - name: Ohne network_dns_adguard kein AdGuard-Eintrag vor dem DHCP-DNS
      ansible.builtin.file:
        path: /etc/resolv.conf.head
        state: absent
      when: not network_dns_adguard | bool
      register: stacks_resolv_head_aus

    - name: Erzeugt dhcpcd die resolv.conf?
      ansible.builtin.command: grep -q "Generated by dhcpcd" /etc/resolv.conf
      register: stacks_resolv_dhcpcd
      changed_when: false
      failed_when: false

    - name: Die resolv.conf neu schreiben lassen
      ansible.builtin.command: dhcpcd --rebind {{ ansible_facts.default_ipv4.interface }}
      when:
        - stacks_resolv_head_an is changed or stacks_resolv_head_aus is changed
        - stacks_resolv_dhcpcd.rc == 0
      changed_when: true

    - name: Hinweis, wenn dhcpcd die resolv.conf nicht verwaltet
      ansible.builtin.debug:
        msg: "network_dns_adguard wirkt nur mit dhcpcd (DHCP). Bei fester IP 127.0.0.1 selbst als ersten nameserver in /etc/resolv.conf eintragen."
      when:
        - network_dns_adguard | bool
        - stacks_resolv_dhcpcd.rc != 0

    - name: DNS-Einstellungen von AdGuard lesen
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ stacks_ports.adguard_ui }}/control/dns_info
        user: "{{ admin_user }}"
        password: "{{ stacks_web_password }}"
        force_basic_auth: true
        return_content: true
      register: stacks_adguard_dns_info
      when: network_dns_adguard | bool
      no_log: true

    # Alle Anfragen des NAS und der Exit-Node-Geräte kommen von 127.0.0.1 und teilten sich sonst ein Rate-Limit
    - name: 127.0.0.1 vom Rate-Limit ausnehmen
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ stacks_ports.adguard_ui }}/control/dns_config
        method: POST
        user: "{{ admin_user }}"
        password: "{{ stacks_web_password }}"
        force_basic_auth: true
        body_format: json
        body:
          ratelimit_whitelist: "{{ (stacks_adguard_dns_info.json.ratelimit_whitelist | default([], true)) + ['127.0.0.1'] }}"
      when:
        - network_dns_adguard | bool
        - "'127.0.0.1' not in (stacks_adguard_dns_info.json.ratelimit_whitelist | default([], true))"
      changed_when: true
      no_log: true
