---
# Images mit festen Tags (geprüft am 2026-10-18). Renovate meldet Updates.
stacks_images:
  caddy: docker.io/library/caddy:2.11.7
  adguard: docker.io/adguard/adguardhome:v0.107.79
  socket_proxy: docker.io/tecnativa/docker-socket-proxy:v0.5.0
  homepage: ghcr.io/gethomepage/homepage:v2.6.0
  arcane: ghcr.io/getarcaneapp/arcane:v2.17.1
  beszel: docker.io/henrygd/beszel:0.21.1
  beszel_agent: docker.io/henrygd/beszel-agent:0.21.1
  scrutiny: ghcr.io/analogj/scrutiny:v0.9.5-omnibus
  dozzle: docker.io/amir20/dozzle:v11.3.5
  ntfy: docker.io/binwiederhier/ntfy:v2.33.1
  uptime_kuma: docker.io/louislam/uptime-kuma:2.5.7
  # Medien (M5): linuxserver-Images, stabile Releases (keine nightly/develop-Tags)
  prowlarr: ghcr.io/linuxserver/prowlarr:2.6.5.5623-ls163
  sabnzbd: ghcr.io/linuxserver/sabnzbd:5.1.3-ls277
  sonarr: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329
  radarr: ghcr.io/linuxserver/radarr:6.4.4.10685-ls321
  lidarr: ghcr.io/linuxserver/lidarr:3.1.0.4875-ls43
  bazarr: ghcr.io/linuxserver/bazarr:v1.6.2-ls368
  recyclarr: ghcr.io/recyclarr/recyclarr:8.8.0
  # 4.10 ist die stabile Version; 4.11.x sind Vorabversionen (Stand 2026-10-18)
  emby: docker.io/emby/embyserver:4.10.2.0
  # eigene Apps des Nutzers
  recommendarr: ghcr.io/d-a-w-n/recommendarr:v2.12.1
  ps2gamemanager: ghcr.io/d-a-w-n/ps2gamemanager:2.3.0

# Ports der Container auf dem Host, nur an 127.0.0.1 gebunden; Zugriff über Caddy.
# Caddy (80/443) und AdGuard (53, UI 8083) laufen im Host-Netzwerk.
stacks_ports:
  socket_proxy: 2375
  arcane: 3552
  homepage: 3010
  dozzle: 3020
  beszel: 3030
  scrutiny: 3040
  ntfy: 3050
  uptime_kuma: 3060
  adguard_ui: 8083
  prowlarr: 3100
  sabnzbd: 3101
  sonarr: 3102
  radarr: 3103
  lidarr: 3104
  bazarr: 3105
  recommendarr: 3107
  ps2gamemanager: 3108
  # Emby läuft im Host-Netzwerk auf 8096 (Fernseher/Apps direkt per HTTP, Discovery)
  emby: 8096

# Subdomains unter {{ domain }}
stacks_hosts:
  homepage: home
  arcane: arcane
  dozzle: logs
  beszel: monitor
  scrutiny: disks
  ntfy: ntfy
  uptime_kuma: status
  adguard: adguard
  cockpit: cockpit
  prowlarr: prowlarr
  sabnzbd: sabnzbd
  sonarr: sonarr
  radarr: radarr
  lidarr: lidarr
  bazarr: bazarr
  emby: emby
  recommendarr: recommendarr
  ps2gamemanager: ps2

stacks_secrets_dir: /etc/aunserver/secrets
stacks_network: aunserver
# Kleines Netz nur für Meldungen an ntfy (Sonarr, Radarr, Lidarr), ohne Zugang zu Caddy und Socket-Proxy
stacks_ntfy_network: ntfy

# Alarme in Beszel (Wert, Minuten); Benachrichtigung per ntfy, Thema "beszel"
stacks_beszel_alerts:
  - { name: Status, value: 0, min: 2 }
  - { name: CPU, value: 90, min: 10 }
  - { name: Memory, value: 90, min: 10 }
  - { name: Disk, value: 90, min: 1 }
  - { name: Temperature, value: 80, min: 5 }
stacks_beszel_webhook: ntfy://ntfy:80/beszel?scheme=http

# Recyclarr: TRaSH-Vorlage "[German] HD Bluray + WEB" (Deutsch + DL, 1080p) mit x265-Bonus.
# Skala des Profils: Deutsch 10000, DL +1000, Qualitätsstufen 1700-2900 (Bluray-Gruppen bis 2900,
# WEB-Gruppen bis 2100). +1500 lässt ein deutsches WEB-Release mit x265 einen großen Bluray-Encode
# mit x264 schlagen (Wunsch: platzsparend), ohne DL zu überstimmen.
stacks_recyclarr_x265_score: 1500
# Upgrades nur bis "German DL in guter Qualität" (DL 11000 + 1080p 700 + WEB-Stufe ab 1800),
# nicht weiter bis zur Bluray-Version: die TRaSH-Vorlage ersetzte sonst vorhandene WEB-Releases
# durch viel größere Bluray-Encodes (doppelter Download)
stacks_recyclarr_upgrade_until_score: 13500
# Größen in MB pro Minute Laufzeit. Die TRaSH-Vorlage hat kein Maximum (Befund: Bluray-Encodes
# mit ~150 MB/min, 8-11 GB pro Folge) und verlangt für Bluray-1080p mindestens ~50 MB/min, was
# kleine x265-Encodes als "zu klein" ablehnte. 60 MB/min = 3,6 GB pro Stunde.
stacks_recyclarr_groessen:
  sonarr:
    - { name: HDTV-720p, min: 10, preferred: 20, max: 35 }
    - { name: WEBRip-720p, min: 10, preferred: 20, max: 35 }
    - { name: WEBDL-720p, min: 10, preferred: 20, max: 35 }
    - { name: Bluray-720p, min: 10, preferred: 20, max: 35 }
    - { name: HDTV-1080p, min: 15, preferred: 35, max: 60 }
    - { name: WEBRip-1080p, min: 15, preferred: 35, max: 60 }
    - { name: WEBDL-1080p, min: 15, preferred: 35, max: 60 }
    - { name: Bluray-1080p, min: 15, preferred: 35, max: 60 }
  radarr:
    - { name: HDTV-720p, min: 10, preferred: 25, max: 40 }
    - { name: WEBRip-720p, min: 10, preferred: 25, max: 40 }
    - { name: WEBDL-720p, min: 10, preferred: 25, max: 40 }
    - { name: Bluray-720p, min: 10, preferred: 25, max: 40 }
    - { name: HDTV-1080p, min: 15, preferred: 45, max: 70 }
    - { name: WEBRip-1080p, min: 15, preferred: 45, max: 70 }
    - { name: WEBDL-1080p, min: 15, preferred: 45, max: 70 }
    - { name: Bluray-1080p, min: 15, preferred: 45, max: 70 }

# Servarr-Apps, die per API verbunden werden (Bibliotheksordner, SABnzbd-Kategorie).
# Eigene Kategorienamen statt SABnzbds Standard-Kategorien tv/movies: deren Ordner gingen
# im Test nach der Einrichtung wieder verloren, neu angelegte Kategorien blieben stabil (M5).
# Download-Ordner: complete/<root> (tv, movies, music) wie im Datenlayout.
stacks_arr_apps:
  - { name: sonarr, api: v3, port: 8989, root: tv, category_field: tvCategory, category: sonarr }
  - { name: radarr, api: v3, port: 7878, root: movies, category_field: movieCategory, category: radarr }
  - { name: lidarr, api: v1, port: 8686, root: music, category_field: musicCategory, category: lidarr }
