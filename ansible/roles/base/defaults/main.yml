---
base_packages:
  - acl
  - apt-listchanges
  - ca-certificates
  - curl
  - dnsutils
  - gnupg
  - htop
  - jq
  - lsof
  - needrestart
  - python3-debian
  - python3-ruamel.yaml   # aunserver-config: Kommentare in der config.yml bleiben beim Ändern erhalten
  - rsync
  - sudo
  - systemd-zram-generator
  - tmux
  - unattended-upgrades

# zram: Größe als Ausdruck für systemd-zram-generator
base_zram_size: "min(ram / 2, 4096)"

# Journal begrenzen (SSD schonen)
base_journal_max_use: 500M
