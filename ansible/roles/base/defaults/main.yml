---
base_packages:
  - acl
  - apt-listchanges
  - ca-certificates
  - curl
  - dnsutils
  - gnupg
  - htop
  - jq
  - lsof
  - needrestart
  - python3-debian
  - rsync
  - sudo
  - systemd-zram-generator
  - tmux
  - unattended-upgrades

# zram: Größe als Ausdruck für systemd-zram-generator
base_zram_size: "min(ram / 2, 4096)"

# Automatische Updates (Debian, Security, Backports-Updates, Docker-Repo)
base_auto_reboot: true
base_auto_reboot_time: "04:00"

# Journal begrenzen (SSD schonen)
base_journal_max_use: 500M
