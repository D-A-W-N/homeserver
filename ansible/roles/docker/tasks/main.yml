---
- name: Docker-Repo-Schlüssel (im Repo hinterlegt, Fingerabdruck 9DC8 5822 … 0EBF CD88)
  ansible.builtin.copy:
    src: docker.asc
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Docker-Paketquelle
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      # Von aunserver verwaltet (Ansible), Änderungen werden überschrieben.
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

- name: Paketlisten nach neuer Docker-Quelle aktualisieren
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed # noqa no-handler

- name: Docker installieren
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ordner für Docker-Konfiguration
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/docker
    - /etc/systemd/system/docker.service.d

- name: Docker-Daemon konfigurieren (Log-Rotation)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    docker_daemon:
      log-driver: local
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_file | string }}"
      live-restore: true
  notify: Docker neu starten

- name: Docker startet nur mit eingehängter Datenplatte
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/aunserver.conf
    content: |
      # Von aunserver verwaltet (Ansible), Änderungen werden überschrieben.
      # Ohne Datenplatte sollen Container nicht auf die SSD schreiben (Plan, Abschnitt 5).
      [Unit]
      RequiresMountsFor={{ data_mount }}
    owner: root
    group: root
    mode: "0644"
  notify: Docker neu starten

- name: Admin darf Docker bedienen
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Docker läuft
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Docker-Neustart vor den Stacks ausführen
  ansible.builtin.meta: flush_handlers
