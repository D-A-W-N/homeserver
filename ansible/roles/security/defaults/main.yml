---
# Dienste, die aus LAN und VPN erreichbar sind (Plan, Abschnitt 6)
# 3702 = WS-Discovery (wsdd2, TCP und UDP), 5355 = LLMNR (Name "nas" für Windows)
security_tcp_ports: [22, 53, 80, 443, 445, 3702, 9090]
security_udp_ports: [53, 443, 3702, 5355]
# Über das VPN (tailscale0) ohne Samba-Discovery
security_vpn_tcp_ports: [22, 53, 80, 443, 445, 9090]
security_vpn_udp_ports: [53, 443]

security_fail2ban: true

# Emby im Host-Netzwerk: Web/Apps, Discovery (7359) und DLNA/SSDP (1900), nur LAN (nicht VPN)
security_emby_tcp_ports: [8096]
security_emby_udp_ports: [7359, 1900]
