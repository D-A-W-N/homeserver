---
- name: SSH neu laden
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded

- name: Firewall laden
  ansible.builtin.systemd_service:
    name: nftables.service
    state: reloaded
    daemon_reload: true

- name: Fail2ban neu starten
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: restarted

- name: Sysctl laden
  ansible.builtin.command: sysctl --system
  changed_when: true
