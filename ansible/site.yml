---
- name: NAS einrichten
  hosts: localhost
  connection: local
  become: true
  pre_tasks:
    - name: Konfiguration prüfen
      ansible.builtin.assert:
        that:
          - admin_user != 'root'
          - not (apps.tailscale and apps.wireguard)
        fail_msg: "admin_user darf nicht root sein, und nur eines von tailscale/wireguard ist erlaubt."
        quiet: true

    - name: Benutzerdaten des Admin-Benutzers lesen
      ansible.builtin.getent:
        database: passwd
        key: "{{ admin_user }}"
      failed_when: false

    - name: UID und GID für Container setzen
      ansible.builtin.set_fact:
        puid: "{{ getent_passwd[admin_user][1] }}"
        pgid: "{{ getent_passwd[admin_user][2] }}"
      when: getent_passwd[admin_user] is defined

  roles:
    - base
    - security
    - storage
    - docker
    - cockpit
    - samba
    - stacks
