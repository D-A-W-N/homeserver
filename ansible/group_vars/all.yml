---
hostname: nas
admin_user: admin
timezone: Europe/Berlin

data_mount: /srv/data
data_fs: ext4
stacks_dir: /opt/stacks

ssh_authorized_keys: []

data_dirs:
  - usenet
  - usenet/nzb
  - usenet/incomplete
  - usenet/complete
  - media
  - media/music
  - media/books
  - media/games
  - media/movies
  - media/tv

shares:
  - name: media
    path: media

stacks: [dockge, arr, emby, scrutiny, ps2gamemanager]

stack_configs:
  dockge: []
  arr: [radarr, sonarr, sabnzbd, recommendarr]
  emby: [emby]
  scrutiny: [scrutiny/config, scrutiny/influxdb]
  ps2gamemanager: [ps2gamemanager]

cockpit_plugins: []
