---
# Defaults. Pro Maschine überschreibt /etc/aunserver/config.yml diese Werte.

# System
hostname: nas
admin_user: nasadmin   # "admin" ist in Debian reserviert
timezone: Europe/Berlin
ssh_authorized_keys: []
kernel_backports: false

# Netz: voller Name des NAS; Apps liegen darunter (https://<app>.<domain>)
domain: nas.home.arpa
# Netze, die auf die NAS-Dienste zugreifen dürfen. Leer = Netz der Standard-Schnittstelle.
lan_subnets: []
lan6_subnets: []   # z. B. [fd00::/64]; Link-Local ist immer erlaubt
# DLNA-Abspielgeräte für Emby „Wiedergabe auf“ (z. B. Sonos). Sie beantworten Embys
# SSDP-Suche vom Zufallsport. Leer = keine Regel; feste IPs (DHCP-Reservierung) nötig.
emby_dlna_renderers: []
# Recyclarr: true = eigene recyclarr.yml im appdata-Ordner; Ansible schreibt dann die
# TRaSH-Vorlage nicht mehr darüber, Recyclarr synchronisiert täglich nur die eigene Datei.
recyclarr_eigene_config: false
# ntfy: Zugriff ohne Anmeldung. read-write = jeder im Netz darf lesen und senden;
# write-only = senden weiter ohne Anmeldung (Beszel, Scrutiny, Backup, Update-Check),
# lesen nur mit ntfy-Benutzer (docs/BETRIEB.md, Benachrichtigungen)
ntfy_default_access: read-write
# ntfy: Weckruf über ntfy.sh, nur für die iPhone-App nötig (ohne Inhalt, aber mit Zeitpunkt)
ntfy_ios_push: true
# Caddy: true = Web-Apps zusätzlich unter https://<LAN-IP>:<Port> (stacks_lan_ports), nur aus dem LAN.
# Für Geräte, die die Namen nicht auflösen (z. B. Handy mit Mullvad-App, das DNS nur an Mullvad schickt)
caddy_lan_ports: false
# Ports dazu; die Firewall öffnet genau diese (nur LAN). Homepage fehlt (HOMEPAGE_ALLOWED_HOSTS, Links auf Namen)
stacks_lan_ports:
  prowlarr: 8400
  sabnzbd: 8401
  sonarr: 8402
  radarr: 8403
  lidarr: 8404
  bazarr: 8405
  ntfy: 8410
  adguard: 8411
  dozzle: 8412
  scrutiny: 8413
  beszel: 8414
  arcane: 8415
  recommendarr: 8416
  ps2gamemanager: 8417

# Speicher (Plan, Abschnitt 5)
# true = keine eigene Datenplatte, data_mount liegt auf der Systemplatte
single_disk: false
data_mount: /srv/data
data_label: AUNDATA
appdata_dir: /srv/appdata
stacks_dir: /opt/stacks

data_dirs:
  - usenet
  - usenet/incomplete
  - usenet/complete
  - usenet/complete/tv
  - usenet/complete/movies
  - usenet/complete/music
  - media
  - media/tv
  - media/movies
  - media/music
  - media/books
  - games
  - shares
# games/ps2 legt die Samba-Legacy-Rolle an (Gruppe ps2share)

# Start-Freigaben; danach werden Freigaben in Cockpit gepflegt (D6)
samba_initial_shares:
  - name: media
    path: media
  - name: shares
    path: shares

# Apps (Plan, Abschnitt 4); Plattform-Dienste sind immer aktiv
apps:
  adguard: true
  tailscale: true
  wireguard: false
  uptime_kuma: false
  emby: true
  recommendarr: true
  ps2gamemanager: true

# Backup der Einstellungen mit restic (M8). repository: jedes restic-Ziel, z. B.
#   /mnt/backup/aunserver          (USB-Platte, siehe disk_label)
#   sftp:user@rechner:/pfad        (anderer Rechner per SSH-Schlüssel von root)
#   s3:..., b2:..., rest:...       (Cloud; Zugangsdaten unter env)
backup:
  repository: ""            # leer = kein Backup
  disk_label: ""            # z. B. AUNBACKUP: USB-Platte mit diesem Label wird unter /mnt/backup eingehängt
  env: {}                   # zusätzliche Umgebungsvariablen für restic (z. B. B2_ACCOUNT_ID)
  schedule: "*-*-* 03:30"
  keep: { daily: 7, weekly: 4, monthly: 6 }

# SMB1-Freigaben für PS2/OPL in einer getrennten Samba-Instanz (D19)
samba_legacy:
  enabled: false
  port: 1445
  allowed_clients: []
  shares:
    - name: PS2SMB
      path: games/ps2
