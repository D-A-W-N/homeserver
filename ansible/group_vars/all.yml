---
# Defaults. Pro Maschine überschreibt /etc/aunserver/config.yml diese Werte.

# System
hostname: nas
admin_user: nasadmin   # "admin" ist in Debian reserviert
timezone: Europe/Berlin
ssh_authorized_keys: []
kernel_backports: false

# Netz: voller Name des NAS; Apps liegen darunter (https://<app>.<domain>)
domain: nas.home.arpa
# Netze, die auf die NAS-Dienste zugreifen dürfen. Leer = Netz der Standard-Schnittstelle.
lan_subnets: []
lan6_subnets: []   # z. B. [fd00::/64]; Link-Local ist immer erlaubt

# Speicher (Plan, Abschnitt 5)
# true = keine eigene Datenplatte, data_mount liegt auf der Systemplatte
single_disk: false
data_mount: /srv/data
data_label: AUNDATA
appdata_dir: /srv/appdata
stacks_dir: /opt/stacks

data_dirs:
  - usenet
  - usenet/incomplete
  - usenet/complete
  - usenet/complete/tv
  - usenet/complete/movies
  - usenet/complete/music
  - media
  - media/tv
  - media/movies
  - media/music
  - media/books
  - games
  - shares
# games/ps2 legt die Samba-Legacy-Rolle an (Gruppe ps2share)

# Start-Freigaben; danach werden Freigaben in Cockpit gepflegt (D6)
samba_initial_shares:
  - name: media
    path: media
  - name: shares
    path: shares

# Apps (Plan, Abschnitt 4); Plattform-Dienste sind immer aktiv
apps:
  adguard: true
  tailscale: true
  wireguard: false
  uptime_kuma: false
  emby: true

# SMB1-Freigaben für PS2/OPL in einer getrennten Samba-Instanz (D19)
samba_legacy:
  enabled: false
  port: 1445
  allowed_clients: []
  shares:
    - name: PS2SMB
      path: games/ps2
