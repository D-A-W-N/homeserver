---
# Ende-zu-Ende-Test wie mit dem USB-Stick: Dev-ISO bauen, davon in einer KVM-VM installieren
# (UEFI und BIOS), aunserver-setup formatiert die leere Datenplatte und richtet alles ein;
# der zweite Lauf darf nichts ändern. Dieselben Skripte wie lokal (installer/, dev/).
name: vm-test
# Läuft bei jedem PR, damit "vm-test" Pflicht-Check im Ruleset von main sein kann; die VM selbst
# startet nur, wenn der PR etwas berührt, das auf dem NAS landet.
"on":
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vm-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aenderungen:
    runs-on: ubuntu-latest
    outputs:
      vm: ${{ steps.pfade.outputs.vm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # Merge-Commit des PRs und main davor

      - name: Betroffene Pfade
        id: pfade
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # erst einsammeln: "| grep -q" kann git mit SIGPIPE beenden
          geaendert=$(git diff --name-only HEAD^1 HEAD)
          if [ "$EVENT" != pull_request ] \
            || grep -qE '^(ansible|installer|dev|stacks|bin|lib|config|cockpit)/|^\.github/workflows/vm-test\.yml$' <<<"$geaendert"; then
            echo "vm=true" >> "$GITHUB_OUTPUT"
          else
            echo "vm=false" >> "$GITHUB_OUTPUT"
          fi

  vm:
    needs: aenderungen
    if: needs.aenderungen.outputs.vm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { firmware: uefi, scenario: "1" }
          - { firmware: bios, scenario: "2" }
    name: vm (${{ matrix.firmware }})
    defaults:
      run:
        # ausdrücklich bash: dann mit "-eo pipefail", sonst überdeckt "| tee" Fehlschläge
        shell: bash
    env:
      VM_DIR: ${{ github.workspace }}/.vm
      SSH_PORT: "2222"
    steps:
      - uses: actions/checkout@v7

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf libarchive-tools e2fsprogs rsync xorriso

      - name: Name des aktuellen Debian-ISOs
        id: iso
        run: |
          name=$(curl -fsSL https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS \
            | grep -oE 'debian-[0-9.]+-amd64-netinst\.iso$' | head -n1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: ISO aus dem Cache
        uses: actions/cache@v6
        with:
          path: .vm/${{ steps.iso.outputs.name }}
          key: iso-${{ steps.iso.outputs.name }}

      - name: ISO laden und prüfen
        run: dev/vm-test.sh fetch

      - name: SSH-Schlüssel
        run: ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519

      - name: Dev-ISO bauen
        run: installer/build-iso.sh --dev --dev-key ~/.ssh/id_ed25519.pub --out .vm/aunserver-dev.iso

      # SSD + leere HDD, also genau der Zustand nach der Installation vom Stick; das Repo kommt aus dem ISO
      - name: Vom ISO installieren (${{ matrix.firmware }})
        run: |
          dev/vm-test.sh install ${{ matrix.scenario }} --iso .vm/aunserver-dev.iso --headless \
            < /dev/null > "$RUNNER_TEMP/install.log" 2>&1

      - name: Installiertes System starten
        run: |
          dev/vm-test.sh boot ${{ matrix.scenario }} --headless < /dev/null > "$RUNNER_TEMP/boot.log" 2>&1 &
          opts="-p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3"
          timeout 300 bash -c "until ssh $opts nasadmin@localhost true 2>/dev/null; do sleep 5; done"

      - name: Installation prüfen (Repo, Login-Hinweis, Firmware)
        run: |
          ssh_vm() { ssh -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          ssh_vm -n "test -x /opt/aunserver/bin/aunserver-setup"
          # Repo gehört root und ist nicht gruppenbeschreibbar (git archive mit tar.umask=022)
          test "$(ssh_vm -n "stat -c '%a %U' /opt/aunserver")" = "755 root"
          printf 'exit\n' | ssh_vm -tt 2>&1 | tr -d '\r' | grep "aunserver ist installiert"
          if [ "${{ matrix.firmware }}" = uefi ]; then ssh_vm -n "test -d /sys/firmware/efi"; else ssh_vm -n "test ! -d /sys/firmware/efi"; fi

      - name: aunserver-setup, erster Lauf (formatiert die Datenplatte)
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          # Gerätenamen wechseln zwischen Boots; die Datenplatte über ihre Seriennummer finden
          disk=$(ssh_vm "lsblk -dn -o NAME,SERIAL" | awk '$2 == "aundata0" {print $1}')
          echo "Datenplatte: $disk"
          key=$(cat ~/.ssh/id_ed25519.pub)
          ssh -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost \
            "printf '%s\n' aunserver | sudo -S -p '' /opt/aunserver/bin/aunserver-setup --yes \
               --data-disk $disk --format --confirm-disk $disk --hostname nas \
               --ssh-key '$key' --samba-password ci-test-123 --ps2-password ci-ps2-123 \
               --backup-repo /var/backups/aunserver-ci" < /dev/null \
            | tee "$RUNNER_TEMP/run1.log"

      - name: aunserver-setup, zweiter Lauf (muss changed=0 melden)
        run: |
          ssh -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost \
            "printf '%s\n' aunserver | sudo -S -p '' /opt/aunserver/bin/aunserver-setup --yes" < /dev/null \
            | tee "$RUNNER_TEMP/run2.log"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/run2.log" \
            | grep -E 'localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0'

      - name: aunserver-config (im Pfad, Konfiguration gültig, Passwörter verdeckt, nichts liegen gelassen)
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' aunserver-config validate" | grep "in Ordnung"
          anzeige=$(ssh_vm "printf '%s\n' aunserver | sudo -S -p '' aunserver-config show --effective")
          grep -q "^  emby: true" <<<"$anzeige"
          if grep -E 'ci-test-123|ci-ps2-123' <<<"$anzeige"; then exit 1; fi
          # die zusammengeführte Datei mit den Passwörtern gibt es nur während des Laufs
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' test ! -e /run/aunserver/effective.yml"

      - name: Konfiguration ändern (Passwörter in secrets/, diff, --reconfigure behält übrige Werte)
        run: |
          s() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost \
                  "printf '%s\n' aunserver | sudo -S -p '' $*"; }
          konfig=$(s cat /etc/aunserver/config.yml)
          grep -q "^config_version: 2" <<<"$konfig"
          if grep -E 'ci-test-123|ci-ps2-123' <<<"$konfig"; then exit 1; fi
          test "$(s stat -c %a /etc/aunserver/secrets/samba_password)" = 600
          s aunserver-config diff | grep "Keine Änderungen"
          s aunserver-config set emby_dlna_renderers "'[10.0.2.50]'"
          rc=0; s aunserver-config diff || rc=$?
          test "$rc" = 3
          # ohne Terminal: bisherige Werte übernehmen, nichts fragen, nichts verlieren
          s /opt/aunserver/bin/aunserver-setup --yes --reconfigure --no-playbook
          test "$(s aunserver-config get emby_dlna_renderers)" = "[10.0.2.50]"
          test "$(s aunserver-config get samba_legacy.enabled)" = true
          test "$(s aunserver-config get backup.repository)" = /var/backups/aunserver-ci
          test "$(s aunserver-config get hostname)" = nas
          s aunserver-config history | grep -q "aunserver-setup"
          s aunserver-config unset emby_dlna_renderers
          s aunserver-config diff | grep "Keine Änderungen"

      - name: Cockpit-Seite im Browser (Playwright mit dem Chrome des Runners)
        run: |
          mkdir -p "$RUNNER_TEMP/bilder" "$RUNNER_TEMP/pw"
          cp dev/cockpit-test.mjs "$RUNNER_TEMP/pw/"
          (cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install --no-audit --no-fund --silent playwright-core@1.48.2)
          node "$RUNNER_TEMP/pw/cockpit-test.mjs" nasadmin aunserver "$RUNNER_TEMP/bilder"
          # die Seite hat ntfy_ios_push gespeichert: wieder auf den Standard
          ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost \
            "printf '%s\n' aunserver | sudo -S -p '' aunserver-config unset ntfy_ios_push"

      - name: Bilder der Cockpit-Seite
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-${{ matrix.firmware }}
          path: ${{ runner.temp }}/bilder
          if-no-files-found: ignore

      - name: Passwörter ändern (Samba sofort, Web-Passwort mit dem Setup in allen Apps)
        run: |
          s() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost \
                  "printf '%s\n' aunserver | sudo -S -p '' $*"; }
          neu=Neu-Web_Passwort-42
          alt=$(s cat /etc/aunserver/secrets/web_password)
          hash_vorher=$(s pdbedit -L -w -u nasadmin)
          s "sh -c 'echo Samba-Neu-4711 | aunserver-config passwd samba --stdin'"
          test "$(s pdbedit -L -w -u nasadmin)" != "$hash_vorher"
          s "sh -c 'echo $neu | aunserver-config passwd web --stdin'"
          s /opt/aunserver/bin/aunserver-setup --yes > "$RUNNER_TEMP/run3.log"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/run3.log" | grep -E 'localhost +: ok=[0-9]+ +changed=[0-9]+ +unreachable=0 +failed=0'
          s test ! -e /etc/aunserver/secrets/web_password.alt
          s grep -qF "'Passwort: $neu'" /etc/aunserver/zugaenge.txt
          # Caddy (Basic Auth vor SABnzbd): neu ja, alt nein
          code() { s curl -sk -o /dev/null -w '%{http_code}' -u "nasadmin:$1" \
                     --resolve sabnzbd.nas.home.arpa:443:127.0.0.1 https://sabnzbd.nas.home.arpa/; }
          test "$(code "$neu")" != 401
          test "$(code "$alt")" = 401
          # AdGuard
          test "$(s curl -s -o /dev/null -w '%{http_code}' -u "nasadmin:$neu" http://127.0.0.1:8083/control/status)" = 200
          # Beszel: Benutzer und Superuser
          for c in users _superusers; do
            s curl -sf -o /dev/null -X POST -H "'Content-Type: application/json'" \
              -d "'{\"identity\":\"nasadmin@nas.home.arpa\",\"password\":\"$neu\"}'" \
              http://127.0.0.1:3030/api/collections/$c/auth-with-password
          done
          # Sonarr: Anmeldung per Formular leitet ohne loginFailed weiter
          # (Anführungszeichen für die Shell auf der VM: & trennt dort sonst Befehle)
          ziel=$(s curl -s -o /dev/null -w "'%{redirect_url}'" -d "'username=nasadmin&password=$neu&rememberMe=on'" http://127.0.0.1:3102/login)
          echo "Sonarr leitet weiter nach: $ziel"
          if grep -q loginFailed <<<"$ziel"; then exit 1; fi

      - name: Login-Hinweis aufs Setup nach der Einrichtung weg
        run: |
          ssh_vm() { ssh -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          anmeldung=$(printf 'exit\n' | ssh_vm -tt 2>&1 | tr -d '\r')
          grep -q "Debian GNU/Linux" <<<"$anmeldung"   # die Anmeldung lief wirklich durch
          if grep "aunserver ist installiert" <<<"$anmeldung"; then exit 1; fi

      - name: Recyclarr-Schlüssel nur in secrets.yml
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          # recyclarr.yml verweist per !secret, der Sync im ersten Lauf hat das schon aufgelöst
          test "$(ssh_vm "grep -c '!secret' /srv/appdata/recyclarr/recyclarr.yml")" = 2
          test "$(ssh_vm "grep -cE '_api_key: [0-9a-f]{32}$' /srv/appdata/recyclarr/secrets.yml")" = 2
          test "$(ssh_vm "stat -c %a /srv/appdata/recyclarr/secrets.yml")" = 600
          if ssh_vm "grep -E 'api_key: [0-9a-f]{32}' /srv/appdata/recyclarr/recyclarr.yml"; then exit 1; fi

      - name: Recyclarr hat Größengrenzen und Upgrade-Grenze in Sonarr und Radarr gesetzt
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          api() { # api APP PORT PFAD
            ssh_vm "k=\$(grep -oP '(?<=<ApiKey>)\\w+' /srv/appdata/$1/config.xml); curl -fsS -H \"X-Api-Key: \$k\" http://127.0.0.1:$2/api/v3/$3"
          }
          for app in "sonarr 3102 60" "radarr 3103 70"; do
            read -r name port max <<<"$app"
            api "$name" "$port" qualitydefinition \
              | jq -e --argjson max "$max" '.[] | select(.quality.name == "Bluray-1080p") | .maxSize == $max and .minSize == 15'
            api "$name" "$port" qualityprofile \
              | jq -e '.[] | select(.name == "[German] HD Bluray + WEB") | .cutoffFormatScore == 13500'
          done

      - name: Firewall ohne DLNA-Liste, PS2-IP und LAN-Ports wie bisher (kein SSDP, keine Umleitung, kein 8400)
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          # Die CI setzt weder emby_dlna_renderers noch samba_legacy.allowed_clients: dann darf weder
          # 1900 noch das Set noch die Umleitung 445 -> 1445 für die PS2 auftauchen; ohne
          # caddy_lan_ports weder die Ports 8400-8417 noch eine IP-Adresse im Caddyfile
          regeln=$(ssh_vm "printf '%s\n' aunserver | sudo -S -p '' nft list table inet aunserver")
          grep -q "chain input" <<<"$regeln"
          if grep -E '1900|dlna_renderers|prerouting|redirect|8400' <<<"$regeln"; then exit 1; fi
          caddyfile=$(ssh_vm "printf '%s\n' aunserver | sudo -S -p '' cat /opt/stacks/proxy/caddy/Caddyfile")
          grep -q "sonarr.nas.home.arpa {" <<<"$caddyfile"
          if grep -E 'https://[0-9.]+:84' <<<"$caddyfile"; then exit 1; fi

      - name: Backup ausführen und Sicherung prüfen
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' systemctl start aunserver-backup.service"
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' aunserver-backup snapshots" | tee "$RUNNER_TEMP/snapshots.log"
          grep -q "aunserver" "$RUNNER_TEMP/snapshots.log"
          # nach dem Backup laufen alle Container wieder
          test "$(ssh_vm "docker ps --filter status=exited -q | wc -l")" = 0

      - name: Wiederherstellung prüfen (gelöschte Sonarr-Konfiguration kommt zurück)
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' rm /srv/appdata/sonarr/config.xml"
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' aunserver-backup restore"
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' test -s /srv/appdata/sonarr/config.xml"
          test "$(ssh_vm "docker ps --filter status=exited -q | wc -l")" = 0

      - name: Docker-Neustart wie bei einem Update (Container mit Socket verbinden neu)
        run: |
          ssh_vm() { ssh -n -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null nasadmin@localhost "$@"; }
          ssh_vm "printf '%s\n' aunserver | sudo -S -p '' systemctl restart docker"
          sleep 30
          ssh_vm "systemctl is-active aunserver-docker-socket"
          # Homepage fragt über den socket-proxy, Arcane direkt am Socket
          # Ausgaben erst einsammeln: "| grep -q" kann ssh mit SIGPIPE beenden (pipefail)
          version=$(ssh_vm "docker exec homepage wget -qO- -T 5 http://socket-proxy:2375/version")
          grep -q ApiVersion <<<"$version"
          arcane_neu=$(ssh_vm "docker logs --since 2m arcane 2>&1")
          grep -q "Docker API versions detected" <<<"$arcane_neu"
          # Arcane darf in /opt/stacks schreiben (.env.global, eigene Stacks)
          arcane_alles=$(ssh_vm "docker logs arcane 2>&1")
          if grep "permission denied" <<<"$arcane_alles"; then exit 1; fi
          test "$(ssh_vm "docker ps --filter status=exited -q | wc -l")" = 0

      - name: Warnungen im Playbook
        if: always()
        run: grep -hiE '\[WARNING\]|\[DEPRECATION' "$RUNNER_TEMP"/run*.log | sort | uniq -c || echo "keine"

      - name: Logs bei Fehler
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP"/*.log || true

  # Pflicht-Check im Ruleset: grün, wenn die VM bestanden hat oder nicht nötig war
  vm-test:
    needs: [aenderungen, vm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis
        env:
          AENDERUNGEN: ${{ needs.aenderungen.result }}
          VM: ${{ needs.vm.result }}
        run: |
          echo "aenderungen: $AENDERUNGEN, vm: $VM"
          [ "$AENDERUNGEN" = success ] && { [ "$VM" = success ] || [ "$VM" = skipped ]; }
