---
name: lint
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Werkzeuge installieren
        run: |
          pip install -r requirements-dev.txt
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files 'bin/*' 'installer/*.sh' 'dev/*.sh')
          if [ "${#files[@]}" -gt 0 ]; then shellcheck "${files[@]}"; fi
      - name: yamllint
        run: yamllint .
      - name: Renovate-Konfiguration prüfen
        # Renovate nutzt RE2 (z. B. keine Lookaheads); Fehler sonst erst im Dependency Dashboard sichtbar
        run: npx --yes --package renovate@44 renovate-config-validator renovate.json
      - name: ansible-lint
        run: cd ansible && ansible-lint
      - name: Syntaxprüfung
        run: cd ansible && ansible-playbook -i localhost, site.yml --syntax-check -e @../config.example.yml
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
