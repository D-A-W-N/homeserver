---
name: lint
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Werkzeuge installieren
        run: |
          pip install -r requirements-dev.txt
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files 'bin/*' 'installer/*.sh' 'dev/*.sh')
          if [ "${#files[@]}" -gt 0 ]; then shellcheck "${files[@]}"; fi
      - name: yamllint
        run: yamllint .
      - name: Cockpit-Seite (JavaScript-Syntax, Manifest)
        run: |
          node --check cockpit/aunserver/aunserver.js
          node --check dev/cockpit-test.mjs
          python3 -m json.tool cockpit/aunserver/manifest.json > /dev/null
      - name: Konfigurationsschema (Tests, erzeugte Dateien aktuell, Beispiel gültig)
        run: |
          python3 -m unittest discover -s tests -v
          bin/aunserver-config generate --check
          bin/aunserver-config validate config.example.yml
      - name: Renovate-Konfiguration prüfen
        # Renovate nutzt RE2 (z. B. keine Lookaheads); Fehler sonst erst im Dependency Dashboard sichtbar
        run: npx --yes --package renovate@44 renovate-config-validator renovate.json
      - name: ansible-lint
        run: cd ansible && ansible-lint
      - name: Vorlagen mit und ohne Medien-Apps (Compose, Caddy, D25)
        run: |
          caddy=$(awk '$1 == "caddy:" {print $2}' ansible/roles/stacks/defaults/main.yml)
          pruefe() { # pruefe NAME KONFIG STACKS...
            local name=$1 konfig=$2 ziel="$RUNNER_TEMP/vorlagen/$1" c
            shift 2
            mkdir -p "$ziel"
            printf '%s\n' "$konfig" > "$ziel.yml"
            bin/aunserver-config effective "$ziel.yml" --out "$ziel-eff.yml"
            ANSIBLE_PYTHON_INTERPRETER=auto_silent ansible-playbook -i localhost, -c local dev/vorlagen-test.yml \
              -e "@$ziel-eff.yml" -e "ziel=$ziel" > /dev/null
            for c in "$@"; do docker compose -f "$ziel/$c/compose.yaml" config -q; done
            docker run --rm -v "$ziel/proxy:/etc/caddy:ro" "$caddy" caddy adapt --config /etc/caddy/Caddyfile > /dev/null
            echo "$name: in Ordnung ($*)"
          }
          pruefe standard '{}' media ps2
          pruefe ohne-medien 'apps: {medien: false, recommendarr: false}' media ps2
          # ohne jede Medien-App entfernt Ansible den Stack media, statt ihn auszurollen
          pruefe nur-dateien 'apps: {medien: false, emby: false, recommendarr: false, ps2gamemanager: false}'
          for f in proxy/Caddyfile dashboard/services.yaml zugaenge.txt; do
            grep -q sonarr "$RUNNER_TEMP/vorlagen/standard/$f"
            if grep sonarr "$RUNNER_TEMP/vorlagen/ohne-medien/$f"; then exit 1; fi
          done
      - name: Syntaxprüfung
        run: cd ansible && ansible-playbook -i localhost, site.yml --syntax-check -e @../config.example.yml
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
