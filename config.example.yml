---
# Beispiel für /etc/aunserver/config.yml (pro Maschine, nicht einchecken).
# Alles hier überschreibt die Defaults aus ansible/group_vars/all.yml.
hostname: nas
admin_user: nasadmin   # "admin" ist in Debian reserviert
timezone: Europe/Berlin
domain: nas.home.arpa
ssh_authorized_keys: []
#  - ssh-ed25519 AAAA... ich@laptop

apps:
  adguard: true
  tailscale: true
  wireguard: false
  uptime_kuma: false
  emby: true
  recommendarr: true
  ps2gamemanager: true

# DLNA-Abspielgeräte (z. B. Sonos) für Emby „Wiedergabe auf“, feste IPs
emby_dlna_renderers: []   # z. B. [192.168.1.110, 192.168.1.207]

# SMB1 für PS2/OPL (getrennte Samba-Instanz, nur SMB1, eigener Benutzer ps2)
samba_legacy:
  enabled: true
  port: 1445
  allowed_clients: []    # z. B. [192.168.1.50] = nur die PS2; sie erreicht die Freigabe dann auch über Port 445
  shares:
    - name: PS2SMB
      path: games/ps2
