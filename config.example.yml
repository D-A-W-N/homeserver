---
# Beispiel für /etc/homeserver/config.yml (pro Maschine, nicht einchecken).
# Alles hier überschreibt die Defaults aus ansible/group_vars/all.yml.
hostname: nas
admin_user: admin
timezone: Europe/Berlin
data_mount: /srv/data
data_fs: ext4
ssh_authorized_keys: []
shares:
  - name: media
    path: media
stacks: [dockge, arr, emby, scrutiny, ps2gamemanager]
