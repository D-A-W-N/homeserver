---
# Beispiel für /etc/aunserver/config.yml (pro Maschine, nicht einchecken).
# Alles hier überschreibt die Defaults aus ansible/group_vars/all.yml.
hostname: nas
admin_user: admin
timezone: Europe/Berlin
domain: nas.home.arpa
ssh_authorized_keys: []
#  - ssh-ed25519 AAAA... ich@laptop

apps:
  adguard: true
  tailscale: true
  wireguard: false
  uptime_kuma: false
  emby: true
